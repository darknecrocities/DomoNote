name: Release Application Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-release-windows:
    name: Build & Publish Release
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 9.0 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application & Desktop Installer
        run: powershell -ExecutionPolicy Bypass -File scripts/build-windows.ps1

      - name: Build Linux Packages (Debian, AppImage, Portable)
        run: python scripts/build-linux.py

      - name: Generate Checksums
        run: |
          Set-Location public\downloads
          Get-ChildItem -File | Where-Object { $_.Name -ne "SHA256SUMS.txt" } | Get-FileHash -Algorithm SHA256 | 
            ForEach-Object { "$($_.Hash)  $($_.Path | Split-Path -Leaf)" } | 
            Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Create GitHub Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: DomoNote ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            public/downloads/DomoNote-Setup-x64.exe
            public/downloads/DomoNote-Windows-Portable.zip
            public/downloads/DomoNote-Setup.bat
            public/downloads/DomoNote-macOS-Universal.dmg
            public/downloads/DomoNote-macOS-arm64.dmg
            public/downloads/DomoNote-macOS-x64.dmg
            public/downloads/DomoNote-Linux-x86_64.AppImage
            public/downloads/domonote_1.0.2_amd64.deb
            public/downloads/DomoNote-Linux-x64.tar.gz
            public/downloads/DomoNote-Setup.sh
            public/downloads/DomoNote-Chrome-Extension.zip
            public/downloads/SHA256SUMS.txt
