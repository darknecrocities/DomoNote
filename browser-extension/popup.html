<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 280px;
      margin: 0;
      padding: 16px;
      background-color: #09090b;
      color: #fafafa;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .header h1 {
      font-size: 14px;
      font-weight: 600;
      margin: 0;
    }
    .status {
      font-size: 11px;
      color: #a1a1aa;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .btn {
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      padding: 8px 12px;
      background-color: #ffffff;
      color: #000000;
      font-size: 12px;
      font-weight: 500;
      text-decoration: none;
      border-radius: 6px;
      cursor: pointer;
      border: none;
      transition: background 0.15s;
    }
    .btn:hover {
      background-color: #e4e4e7;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>DomoNote Capture</h1>
  </div>
  <p class="status">
    Capture tab audio and Google Meet transcripts into your local-first workspace.
  </p>
  <button id="open-app-btn" class="btn">Launch DomoNote</button>
  <script src="popup.js"></script>
</body>
</html>
